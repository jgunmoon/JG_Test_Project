# RAN1 트래커: 매일 자동 실행 + 수동 실행
# 매일 한국시간 오전 8시 47분경 자동으로 실행합니다 (GitHub 사정에 따라 수십 분 늦어질 수 있음).
# 바로 확인하려면 GitHub 저장소 → Actions → "RAN1 tracker" → "Run workflow" 버튼으로 실행합니다.
# 새 회의 종료본(또는 결정이 담긴 비종료본)이 있으면 DB와 리포트를 갱신해 커밋합니다. 없으면 아무것도 바꾸지 않습니다.
# 실행이 끝나면 reports/ 폴더(HTML 대시보드 포함)를 GitHub Pages로 다시 게시합니다.
name: RAN1 tracker

on:
  schedule:
    # UTC 기준입니다. 23:47 UTC = 한국시간 08:47. 정각(0분)은 GitHub 실행이 몰려 늦어지기 쉬워 피했습니다.
    - cron: "47 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "확인만 하기 (처리할 회의 목록만 출력하고 아무것도 바꾸지 않음)"
        type: boolean
        default: false
      since:
        description: "이 회의부터 확인 (비우면 config의 track_from). 예: RAN1#122"
        type: string
        required: false

permissions:
  contents: write   # 갱신된 DB와 리포트를 커밋하기 위해 필요

concurrency:
  group: ran1-tracker   # 동시에 두 번 눌러도 하나씩 실행
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Check 3GPP FTP and update
        shell: bash   # -eo pipefail: tee 뒤에 가려져도 스크립트 오류면 실패로 표시
        env:
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m scripts.check_schedule "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit updated DB and reports
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- data reports; then
            echo "변경 없음 — 커밋하지 않습니다." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git commit -m "Update RAN1 tracker data and reports"
          git push

  # reports/ 폴더를 GitHub Pages로 게시합니다 (Settings → Pages → Source: GitHub Actions 필요).
  # 주소: https://<계정>.github.io/<저장소>/  → reports/index.html 대시보드가 열립니다.
  pages:
    needs: track
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # track 작업이 방금 커밋한 최신 리포트를 받기 위해 브랜치 최신 상태로

      - uses: actions/upload-pages-artifact@v4
        with:
          path: reports

      - id: deploy
        uses: actions/deploy-pages@v4
